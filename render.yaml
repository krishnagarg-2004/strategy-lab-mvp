services:
  # Backend API Service
  - type: web
    name: strategy-lab-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: strategy-lab-db
          property: connectionString
      - key: PYTHONUNBUFFERED
        value: "1"

  # Frontend Web Service
  - type: web
    name: strategy-lab-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    region: singapore
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: strategy-lab-backend
          property: host

databases:
  - name: strategy-lab-db
    plan: free
    region: singapore
    databaseName: strategy_lab
    user: strategy_lab_user
