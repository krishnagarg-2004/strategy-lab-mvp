
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: strategy_lab
      POSTGRES_USER: strategy_lab
      POSTGRES_PASSWORD: strategy_lab_dev_only
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strategy_lab -d strategy_lab"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://strategy_lab:strategy_lab_dev_only@db:5432/strategy_lab
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata: